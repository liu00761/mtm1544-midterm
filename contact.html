     <style>
@import url('https://fonts.googleapis.com/css2?family=Aboreto&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
</style>

<body>
       <header>
        <a href="#main" class="skip-link">Skip to main content</a>
        <a class="logo" href="index.html">Moon and Marigold</a>
        <nav>
            <ul class="navbar">
                <li><a href="about.html">About</a></li>
                <li><a href="all-products.html">All Products</a></li>
                <li><a href="featured.html">Featured</a></li>
                <li><a href="contact.html">Contact</a></li>
                <button class="cart">Cart</button>
            </ul>
         </nav>
    </header>
    <main id="main">
        <h1>Contact Us</h1>
        <p>Call 613-294-3842, or submit an inquiry here and we will respond within 3 business days.</p>
        <form action="thanks.html" method="get">
            <label for="name">Name</label>
            <input id="name" name="name" autocomplete="name" required>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <label for="service">Service</label>
            <select id="service" name="service">
                <option>Custom Bouquet</option>
                <option>Event Order</option>
                <option>Questions</option>
                <option>Other</option>
            </select>
            <label for="details">Comments</label>
            <textarea id="details" name="details" rows="4" required></textarea>
            <button type="submit">Submit</button>
        </form>
        <hr>
    </main>
    <footer>
        <div class="footertext">
            <h3>Moon and Marigold</h3>
            <p>2739 Frauser Street, Kinston, K2K 8Y6</p>
            <p>613-294-3842</p>
            <p class="copyright" >Moon and Marigold 2026</p>
        </div>
    </footer>

</body>
</html>
